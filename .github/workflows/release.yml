name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag in vX.Y.Z format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy
      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release workflows must run from main; received $GITHUB_REF." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists. Choose a new version." >&2
            exit 1
          fi
          node scripts/check-release-version.mjs "$TAG"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p s2-mcp --test protocol executor_terminates_infinite_program_at_production_deadline -- --ignored --exact
      - run: cargo test --locked -p s2-mcp --test s2_lite -- --ignored

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            executable: s2-mcp
            archive: tar
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
            executable: s2-mcp
            archive: tar
          - os: macos-26
            target: aarch64-apple-darwin
            platform: darwin-arm64
            executable: s2-mcp
            archive: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            executable: s2-mcp.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --package s2-mcp --target ${{ matrix.target }}
      - shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.executable }} --version
      - if: matrix.archive == 'tar'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/s2-mcp-$TAG-${{ matrix.target }}.tar.gz" "${{ matrix.executable }}"
      - if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}" -DestinationPath "dist/s2-mcp-$env:TAG-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  package-npm:
    name: Package npm
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-x64
          path: native/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          path: native/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-win32-x64
          path: native/win32-x64
      - run: node scripts/assemble-npm-package.mjs "${{ needs.validate.outputs.version }}" native dist/package/s2-mcp
      - run: npm pack ./dist/package/s2-mcp --pack-destination dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error

  smoke-npm:
    name: Smoke npm ${{ matrix.platform }}
    needs: [validate, package-npm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-26-intel
            platform: darwin-x64
          - os: macos-26
            platform: darwin-arm64
          - os: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm
      - shell: bash
        run: node scripts/smoke-npm-package.mjs dist/npm/s2-mcp-${{ needs.validate.outputs.version }}.tgz "${{ needs.validate.outputs.version }}"

  publish-npm:
    name: Publish npm
    needs: [validate, smoke-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm
      - run: |
          failed=0
          for package in dist/npm/*.tgz; do
            if ! npm publish "$package" --access public --provenance; then
              failed=1
            fi
          done
          exit "$failed"

  tag-and-draft-release:
    name: Tag and draft GitHub release
    needs: [validate, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm
      - env:
          TAG: ${{ inputs.tag }}
        run: |
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"
      - name: Create checksums
        working-directory: dist
        run: sha256sum release/* npm/* > SHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" dist/release/* dist/npm/* dist/SHA256SUMS --draft --title "$TAG" --verify-tag
