name: Binary size

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Measure ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            executable: s2-mcp
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
            executable: s2-mcp
          - os: macos-26
            target: aarch64-apple-darwin
            platform: darwin-arm64
            executable: s2-mcp
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            executable: s2-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --package s2-mcp --target ${{ matrix.target }}
      - shell: bash
        run: node scripts/check-binary-size.mjs target/${{ matrix.target }}/release/${{ matrix.executable }} ${{ matrix.platform }} dist/sizes/${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: binary-size-${{ matrix.platform }}
          path: dist/sizes/${{ matrix.platform }}.json
          if-no-files-found: error

  report:
    name: Report binary sizes
    needs: measure
    if: always() && needs.measure.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-size-*
          path: dist/sizes
          merge-multiple: true
      - uses: actions/github-script@v7
        env:
          CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          script: |
            const fs = require("node:fs")
            const marker = "<!-- s2-mcp-binary-size -->"
            const measurements = fs.readdirSync("dist/sizes")
              .filter((file) => file.endsWith(".json"))
              .map((file) => JSON.parse(fs.readFileSync(`dist/sizes/${file}`, "utf8")))
              .sort((left, right) => left.platform.localeCompare(right.platform))
            const rows = measurements.map(({ platform, bytes, megabytes, mebibytes }) =>
              `| ${platform} | ${bytes.toLocaleString("en-US")} | ${megabytes.toFixed(2)} MB | ${mebibytes.toFixed(2)} MiB |`
            const body = [
              marker,
              "### Native binary sizes",
              "| Platform | Bytes | Decimal | Binary |",
              "| --- | ---: | ---: | ---: |",
              ...rows,
              "",
              "Measurements are informational and do not block releases.",
            ].join("\n")
            await core.summary.addRaw(body.replace(marker, "")).write()
            if (process.env.CAN_COMMENT !== "true") return
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const previous = comments.find((comment) => comment.body?.includes(marker))
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
