name: Publish npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate npm release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      published: ${{ steps.published.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@1.89
      - id: version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME must reference a commit on main." >&2
            exit 1
          fi
          node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: published
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if npm view "s2-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build npm ${{ matrix.platform }}
    needs: validate
    if: needs.validate.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            executable: s2-mcp
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
            executable: s2-mcp
          - os: macos-26
            target: aarch64-apple-darwin
            platform: darwin-arm64
            executable: s2-mcp
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            executable: s2-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --package s2-mcp --target ${{ matrix.target }}
      - shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.executable }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error

  package:
    name: Package npm
    needs: [validate, build]
    if: needs.validate.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-x64
          path: native/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          path: native/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-win32-x64
          path: native/win32-x64
      - run: node scripts/assemble-npm-package.mjs "${{ needs.validate.outputs.version }}" native dist/package/s2-mcp
      - run: |
          mkdir -p dist/npm
          npm pack ./dist/package/s2-mcp --pack-destination dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/npm/s2-mcp-${{ needs.validate.outputs.version }}.tgz
          if-no-files-found: error

  smoke:
    name: Smoke npm ${{ matrix.platform }}
    needs: [validate, package]
    if: needs.validate.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-26-intel
            platform: darwin-x64
          - os: macos-26
            platform: darwin-arm64
          - os: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/npm
      - shell: bash
        run: node scripts/smoke-npm-package.mjs ./dist/npm/s2-mcp-${{ needs.validate.outputs.version }}.tgz "${{ needs.validate.outputs.version }}"

  publish:
    name: Publish npm
    needs: [validate, smoke]
    if: needs.validate.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/npm
      - run: npm publish ./dist/npm/s2-mcp-${{ needs.validate.outputs.version }}.tgz --access public --provenance
