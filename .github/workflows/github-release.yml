name: Publish GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy
      - run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME must reference a commit on main." >&2
            exit 1
          fi
          node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p s2-mcp --test protocol executor_terminates_infinite_program_at_production_deadline -- --ignored --exact
      - run: cargo test --locked -p s2-mcp --test s2_lite -- --ignored

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            executable: s2-mcp
            archive: tar
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
            executable: s2-mcp
            archive: tar
          - os: macos-26
            target: aarch64-apple-darwin
            platform: darwin-arm64
            executable: s2-mcp
            archive: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            executable: s2-mcp.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --package s2-mcp --target ${{ matrix.target }}
      - run: node scripts/check-binary-size.mjs target/${{ matrix.target }}/release/${{ matrix.executable }}
      - shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.executable }} --version
      - if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/s2-mcp-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" "${{ matrix.executable }}"
      - if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}" -DestinationPath "dist/s2-mcp-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum release/* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/release/* dist/SHA256SUMS --draft --title "$TAG" --verify-tag
          fi
