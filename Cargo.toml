[workspace]
resolver = "2"
members = ["crates/s2-mcp", "crates/s2-mcp-codemode"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/eersnington/s2-mcp"
rust-version = "1.89"
version = "0.0.1"

[workspace.dependencies]
base64ct = "1.8"
clap = "4.6"
deno_ast = { version = "=0.52.0", features = ["transpiling", "visit"] }
deno_core = { version = "=0.381.1", features = ["include_icu_data"] }
deno_error = "=0.7.1"
dirs = "6.0"
# rusty_v8's temporal_rs 0.1.2 is not compatible with the ICU 2.2 API.
icu_calendar = "=2.1.1"
icu_locale = "=2.1.1"
icu_normalizer = "=2.1.1"
icu_properties = "=2.1.2"
icu_provider = "=2.1.1"
rmcp = { version = "=3.0.0", default-features = false }
s2-mcp-codemode = { path = "crates/s2-mcp-codemode" }
s2-sdk = "=0.33.0"
s2-testcontainers = "=0.41.2"
schemars = "1.2"
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.53"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
